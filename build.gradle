buildscript {
  repositories {
	gradlePluginPortal()
	mavenCentral()
	mavenLocal()
	maven {
	  url = uri("https://maven.pkg.github.com/Forsakringskassan/repository")
	  credentials {
        username = project.findProperty("GITHUB_ACTOR") ?: System.getenv("PACKAGES_RW_ACTOR")
        password = project.findProperty("GITHUB_TOKEN") ?: System.getenv("PACKAGES_RW_TOKEN")
	  }
	}
  }

  dependencies {
    classpath "se.fk.gradle:gradle-conventions:1.18.3"
  }
}

apply plugin: "se.fk.gradle.bundle-openapi"

allprojects {
	javaExtension {
		javaVersion = 21
	}
}

project("rimfrost-regel-rtf-manuell-bff-openapi-spec",{
	fkOpenApi {
		generatorName.set("openapi-yaml")
	}
})

project("rimfrost-regel-rtf-manuell-bff-openapi-jaxrs-spec",{
	fkOpenApi {
		generatorName.set("jaxrs-spec")
		// Plain fields for nullable types, and unset fields left out of responses as the spec describes them
		// insert keeps the plugin's default options, put would replace them all
		additionalProperties.insert("openApiNullable", "false")
		additionalProperties.insert("additionalModelTypeAnnotations", "@com.fasterxml.jackson.annotation.JsonInclude(com.fasterxml.jackson.annotation.JsonInclude.Include.NON_NULL)")
	}

	dependencies {
		compileOnly 'jakarta.ws.rs:jakarta.ws.rs-api:4.0.0'
		compileOnly 'jakarta.annotation:jakarta.annotation-api:3.0.0'
		compileOnly 'jakarta.validation:jakarta.validation-api:3.1.1'
		compileOnly 'com.fasterxml.jackson.core:jackson-databind:2.22.4'
		compileOnly 'com.fasterxml.jackson.core:jackson-annotations:2.22'
		compileOnly 'com.fasterxml.jackson.core:jackson-core:2.22.4'
	}
})
